<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline - AniPulse</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800;14..32,900&display=swap" rel="stylesheet">
    <style>
        /* ============================================
           OFFLINE PAGE - PREMIUM ANIPULSE DESIGN
           ============================================ */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0B1120 0%, #1A1F2E 50%, #0B1120 100%);
            background-size: 300% 300%;
            animation: gradientShift 8s ease-in-out infinite;
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        @keyframes gradientShift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        /* ===== FLOATING GLOW ORBS ===== */
        .bg-orbs {
            position: fixed;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
            z-index: 0;
        }

        .bg-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.3;
            animation: orbFloat 10s ease-in-out infinite;
        }

        .bg-orb-1 {
            width: 350px;
            height: 350px;
            background: rgba(139, 92, 246, 0.12);
            top: -120px;
            right: -120px;
            animation-delay: 0s;
        }

        .bg-orb-2 {
            width: 280px;
            height: 280px;
            background: rgba(99, 102, 241, 0.08);
            bottom: -100px;
            left: -100px;
            animation-delay: -4s;
        }

        .bg-orb-3 {
            width: 200px;
            height: 200px;
            background: rgba(236, 72, 153, 0.06);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation-delay: -7s;
        }

        @keyframes orbFloat {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(50px, -50px) scale(1.2); }
            66% { transform: translate(-40px, 40px) scale(0.8); }
        }

        /* ============================================
           OFFLINE CONTAINER
           ============================================ */

        .offline-container {
            text-align: center;
            max-width: 480px;
            width: 100%;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-radius: 40px;
            padding: 48px 36px 40px;
            border: 1px solid rgba(139, 92, 246, 0.15);
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.4);
            position: relative;
            z-index: 1;
            animation: fadeInUp 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        /* Premium Border Glow */
        .offline-container::before {
            content: '';
            position: absolute;
            inset: -1.5px;
            border-radius: 40px;
            background: linear-gradient(135deg, 
                rgba(139, 92, 246, 0.3) 0%, 
                rgba(99, 102, 241, 0.1) 30%,
                rgba(236, 72, 153, 0.05) 60%,
                rgba(139, 92, 246, 0.2) 100%
            );
            background-size: 300% 300%;
            animation: borderGlow 4s ease-in-out infinite;
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
            z-index: -1;
        }

        @keyframes borderGlow {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(40px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* ============================================
           OFFLINE ICON
           ============================================ */

        .offline-icon {
            width: 100px;
            height: 100px;
            margin: 0 auto 20px;
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.15), rgba(99, 102, 241, 0.05));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3.5rem;
            color: #8B5CF6;
            border: 1px solid rgba(139, 92, 246, 0.1);
            animation: float 3s ease-in-out infinite;
            position: relative;
        }

        .offline-icon::after {
            content: '';
            position: absolute;
            inset: -4px;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.1), transparent);
            animation: iconRing 3s ease-in-out infinite;
            z-index: -1;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-12px); }
        }

        @keyframes iconRing {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.1); }
        }

        .offline-icon i {
            animation: wifiPulse 2s ease-in-out infinite;
        }

        @keyframes wifiPulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(0.9); opacity: 0.6; }
        }

        /* ============================================
           TYPOGRAPHY
           ============================================ */

        .offline-badge {
            display: inline-block;
            font-size: 0.65rem;
            font-weight: 700;
            color: #A78BFA;
            background: rgba(139, 92, 246, 0.1);
            padding: 4px 16px;
            border-radius: 20px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            border: 1px solid rgba(139, 92, 246, 0.08);
            margin-bottom: 12px;
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 800;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #FFFFFF 30%, #A78BFA 70%, #6366F1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.03em;
        }

        .offline-subtitle {
            font-size: 1.05rem;
            color: rgba(255, 255, 255, 0.4);
            margin-bottom: 8px;
            font-weight: 400;
        }

        p {
            color: rgba(255, 255, 255, 0.3);
            margin-bottom: 28px;
            line-height: 1.7;
            font-size: 0.9rem;
        }

        /* ============================================
           RETRY BUTTON
           ============================================ */

        .retry-btn {
            background: linear-gradient(135deg, #6366F1, #8B5CF6);
            color: white;
            border: none;
            padding: 14px 36px;
            font-size: 0.95rem;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: inline-flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 4px 20px rgba(99, 102, 241, 0.3);
            position: relative;
            overflow: hidden;
        }

        .retry-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.15), transparent);
            transition: left 0.6s ease;
        }

        .retry-btn:hover::before {
            left: 100%;
        }

        .retry-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 35px -5px rgba(99, 102, 241, 0.5);
        }

        .retry-btn:active {
            transform: translateY(0) scale(0.97);
        }

        .retry-btn i {
            transition: transform 0.3s ease;
        }

        .retry-btn:hover i {
            transform: rotate(180deg);
        }

        /* ============================================
           OFFLINE FEATURES
           ============================================ */

        .offline-features {
            margin-top: 32px;
            padding-top: 28px;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
        }

        .offline-features h3 {
            font-size: 0.8rem;
            font-weight: 700;
            margin-bottom: 16px;
            color: rgba(255, 255, 255, 0.3);
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }

        .offline-features h3 i {
            color: #10B981;
            margin-right: 6px;
        }

        .offline-features ul {
            list-style: none;
            text-align: left;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .offline-features li {
            color: rgba(255, 255, 255, 0.35);
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 6px 12px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.02);
            transition: all 0.3s ease;
        }

        .offline-features li:hover {
            background: rgba(139, 92, 246, 0.04);
            border-color: rgba(139, 92, 246, 0.06);
            transform: translateX(4px);
        }

        .offline-features li:before {
            content: "✓";
            color: #10B981;
            font-weight: 700;
            font-size: 0.7rem;
            flex-shrink: 0;
        }

        /* ============================================
           RESPONSIVE
           ============================================ */

        @media (max-width: 768px) {
            .offline-container {
                padding: 36px 24px 32px;
                border-radius: 32px;
            }

            h1 {
                font-size: 1.8rem;
            }

            .offline-icon {
                width: 80px;
                height: 80px;
                font-size: 2.8rem;
            }

            .offline-subtitle {
                font-size: 0.95rem;
            }
        }

        @media (max-width: 480px) {
            .offline-container {
                padding: 28px 16px 24px;
                border-radius: 24px;
                max-width: 95%;
            }

            h1 {
                font-size: 1.5rem;
            }

            .offline-icon {
                width: 64px;
                height: 64px;
                font-size: 2.2rem;
            }

            .offline-subtitle {
                font-size: 0.85rem;
            }

            p {
                font-size: 0.8rem;
                margin-bottom: 24px;
            }

            .offline-features ul {
                grid-template-columns: 1fr;
            }

            .offline-features li {
                font-size: 0.75rem;
                padding: 5px 10px;
            }

            .retry-btn {
                padding: 12px 28px;
                font-size: 0.85rem;
            }

            .offline-features {
                margin-top: 24px;
                padding-top: 20px;
            }

            .offline-features h3 {
                font-size: 0.7rem;
            }

            .bg-orb-1 {
                width: 150px;
                height: 150px;
                top: -50px;
                right: -50px;
            }

            .bg-orb-2 {
                width: 120px;
                height: 120px;
                bottom: -40px;
                left: -40px;
            }

            .bg-orb-3 {
                width: 100px;
                height: 100px;
            }
        }

        /* ============================================
           REDUCED MOTION
           ============================================ */

        @media (prefers-reduced-motion: reduce) {
            body,
            .offline-container,
            .offline-icon,
            .offline-icon i,
            .bg-orb {
                animation: none !important;
            }

            .offline-container::before {
                animation: none !important;
            }

            .retry-btn {
                transition: none !important;
            }

            .retry-btn::before {
                display: none !important;
            }

            .offline-icon::after {
                animation: none !important;
            }
        }

        /* ============================================
           DARK MODE (Default)
           ============================================ */

        /* Already using dark theme by default */

        /* ============================================
           LIGHT MODE
           ============================================ */

        @media (prefers-color-scheme: light) {
            body {
                background: linear-gradient(135deg, #F8FAFC 0%, #FFFFFF 50%, #F1F5F9 100%);
            }

            .offline-container {
                background: rgba(255, 255, 255, 0.8);
                backdrop-filter: blur(24px);
                -webkit-backdrop-filter: blur(24px);
                border-color: rgba(139, 92, 246, 0.08);
                box-shadow: 0 40px 80px rgba(0, 0, 0, 0.06);
            }

            .offline-container::before {
                background: linear-gradient(135deg, 
                    rgba(139, 92, 246, 0.15) 0%, 
                    rgba(99, 102, 241, 0.08) 30%,
                    rgba(236, 72, 153, 0.04) 60%,
                    rgba(139, 92, 246, 0.1) 100%
                );
            }

            h1 {
                background: linear-gradient(135deg, #1a1f2e 30%, #7C3AED 70%, #6366F1);
                -webkit-background-clip: text;
                background-clip: text;
            }

            .offline-subtitle {
                color: rgba(0, 0, 0, 0.4);
            }

            p {
                color: rgba(0, 0, 0, 0.25);
            }

            .offline-badge {
                color: #7C3AED;
                background: rgba(124, 58, 237, 0.08);
                border-color: rgba(124, 58, 237, 0.06);
            }

            .offline-features {
                border-color: rgba(0, 0, 0, 0.04);
            }

            .offline-features h3 {
                color: rgba(0, 0, 0, 0.3);
            }

            .offline-features li {
                color: rgba(0, 0, 0, 0.3);
                background: rgba(0, 0, 0, 0.02);
                border-color: rgba(0, 0, 0, 0.02);
            }

            .offline-features li:hover {
                background: rgba(139, 92, 246, 0.04);
                border-color: rgba(139, 92, 246, 0.06);
            }

            .offline-icon {
                background: linear-gradient(135deg, rgba(139, 92, 246, 0.08), rgba(99, 102, 241, 0.04));
                border-color: rgba(139, 92, 246, 0.08);
                color: #7C3AED;
            }

            .offline-icon::after {
                background: linear-gradient(135deg, rgba(139, 92, 246, 0.06), transparent);
            }

            .bg-orb-1 {
                background: rgba(139, 92, 246, 0.04);
            }

            .bg-orb-2 {
                background: rgba(99, 102, 241, 0.03);
            }

            .bg-orb-3 {
                background: rgba(236, 72, 153, 0.02);
            }
        }
    </style>
</head>
<body>
    <!-- Floating Glow Orbs -->
    <div class="bg-orbs">
        <div class="bg-orb bg-orb-1"></div>
        <div class="bg-orb bg-orb-2"></div>
        <div class="bg-orb bg-orb-3"></div>
    </div>

    <!-- Offline Container -->
    <div class="offline-container">
        <div class="offline-icon">
            <i class="fas fa-wifi"></i>
        </div>
        
        <div class="offline-badge">
            <i class="fas fa-circle" style="color: #EF4444; font-size: 0.5rem; margin-right: 4px;"></i>
            Offline Mode
        </div>
        
        <h1>You're Offline</h1>
        <p class="offline-subtitle">But don't worry!</p>
        <p>You can still access your saved data and previously loaded content.</p>
        
        <button class="retry-btn" onclick="location.reload()">
            <i class="fas fa-sync-alt"></i>
            Try Again
        </button>
        
        <div class="offline-features">
            <h3><i class="fas fa-check-circle"></i> Available Offline:</h3>
            <ul>
                <li>View your saved anime list</li>
                <li>Check your statistics</li>
                <li>View achievements</li>
                <li>Access settings</li>
                <li>Watchlist management</li>
                <li>Profile information</li>
            </ul>
        </div>
    </div>
</body>
</html>
