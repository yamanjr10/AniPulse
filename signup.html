<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AniPulse - Sign Up</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Poppins:wght@700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="Frontend/Css/login.css">
</head>
<body>
    <div class="particles"></div>
    <div class="floating-element"></div>
    <div class="floating-element"></div>
    
    <div class="theme-toggle-container">
        <button class="theme-toggle-btn" id="themeToggle" aria-label="Toggle theme">
            <i class="fas fa-moon"></i>
        </button>
    </div>
    
    <div class="auth-container">
        <div class="auth-header">
            <div class="app-logo">
                <i class="fas fa-heart-pulse"></i>
                <h1>AniPulse</h1>
            </div>
            <h2>Join AniPulse</h2>
            <p>Start tracking your anime journey today</p>
        </div>
        
        <form class="auth-form" id="signupForm">
            <div class="form-group">
                <label for="username">
                    <i class="fas fa-user"></i>
                    Username
                </label>
                <div class="input-with-icon">
                    <i class="fas fa-user"></i>
                    <input type="text" id="username" placeholder="Enter your username" required>
                </div>
            </div>
            
            <div class="form-group">
                <label for="email">
                    <i class="fas fa-envelope"></i>
                    Email Address
                </label>
                <div class="input-with-icon">
                    <i class="fas fa-envelope"></i>
                    <input type="email" id="email" placeholder="your.email@example.com" required>
                </div>
            </div>
            
            <div class="form-group">
                <label for="password">
                    <i class="fas fa-lock"></i>
                    Password
                </label>
                <div class="input-with-icon">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="password" placeholder="••••••••" required minlength="6">
                    <button type="button" class="password-toggle" id="passwordToggle" aria-label="Show password">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
                <small style="display: block; margin-top: 0.5rem; color: var(--text-light); font-size: 0.85rem;">
                    <i class="fas fa-info-circle"></i> Password must be at least 6 characters
                </small>
            </div>
            
            <button type="submit" class="submit-btn" id="signupBtn">
                <i class="fas fa-user-plus"></i>
                Create Account
            </button>
            
            <div id="msg"></div>
            
            <div class="auth-footer">
                <p>Already have an account? <a href="login.html"><i class="fas fa-sign-in-alt"></i> login here</a></p>
            </div>
        </form>
    </div>

    <script src="Frontend/Js/auth-script.js"></script>
</body>
</html>
