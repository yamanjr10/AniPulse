<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline - AniPulse</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800;14..32,900&display=swap"
        rel="stylesheet">

    <!-- Theme -->
    <meta name="theme-color" content="#0b1120" />
    <meta name="color-scheme" content="dark light" />

    <!-- Main Browser Icon -->
    <link rel="shortcut icon" href="/Frontend/icon/icon-72x72.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/Frontend/icon/icon-72x72.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/Frontend/icon/icon-72x72.png" />

    <!-- PWA Icons -->
    <link rel="apple-touch-icon" sizes="72x72" href="/Frontend/icon/icon-72x72.png" />
    <link rel="apple-touch-icon" sizes="96x96" href="/Frontend/icon/icon-96x96.png" />
    <link rel="apple-touch-icon" sizes="128x128" href="/Frontend/icon/icon-128x128.png" />
    <link rel="apple-touch-icon" sizes="144x144" href="/Frontend/icon/icon-144x144.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/Frontend/icon/icon-152x152.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/Frontend/icon/icon-192x192.png" />
    <link rel="apple-touch-icon" sizes="384x384" href="/Frontend/icon/icon-384x384.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/Frontend/icon/icon-512x512.png" />

    <!-- Windows Tile -->
    <meta name="msapplication-TileColor" content="#6366F1" />
    <meta name="msapplication-TileImage" content="/Frontend/icon/icon-192x192.png" />

    <!-- Disable Cache -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <style>
        /* ============================================
           OFFLINE PAGE - Premium Blue Theme
           ============================================ */

        /* ============================================
           CSS VARIABLES
           ============================================ */
        :root {
            --color-blue: #3B82F6;
            --color-blue-dark: #2563EB;
            --color-blue-light: #60A5FA;
            --color-indigo: #6366F1;
            --color-indigo-light: #818CF8;
            --color-cyan: #06B6D4;
            --color-cyan-light: #67E8F9;
            --color-violet: #8B5CF6;
            --color-violet-light: #A78BFA;

            --bg-body: #0B1120;
            --bg-glass: rgba(30, 41, 59, 0.7);
            --bg-card: rgba(15, 23, 42, 0.6);

            --text-primary: #F8FAFC;
            --text-secondary: #94A3B8;
            --text-muted: #64748B;

            --border: rgba(59, 130, 246, 0.12);
            --border-hover: rgba(59, 130, 246, 0.3);

            --shadow-glow: 0 8px 32px rgba(59, 130, 246, 0.15);
            --radius-full: 9999px;
            --transition-base: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        [data-theme="light"] {
            --bg-body: #F8FAFC;
            --bg-glass: rgba(255, 255, 255, 0.7);
            --bg-card: rgba(255, 255, 255, 0.8);

            --text-primary: #0F172A;
            --text-secondary: #475569;
            --text-muted: #94A3B8;

            --border: rgba(59, 130, 246, 0.08);
            --border-hover: rgba(59, 130, 246, 0.3);

            --shadow-glow: 0 8px 32px rgba(59, 130, 246, 0.08);
        }

        /* ============================================
           RESET & BASE
           ============================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-body);
            background-image: radial-gradient(ellipse at 10% 20%, rgba(59, 130, 246, 0.06) 0%, transparent 50%),
                radial-gradient(ellipse at 90% 80%, rgba(6, 182, 212, 0.04) 0%, transparent 50%);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
            transition: background 0.3s ease, color 0.3s ease;
        }

        [data-theme="light"] body {
            background-image: radial-gradient(ellipse at 10% 20%, rgba(59, 130, 246, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 90% 80%, rgba(6, 182, 212, 0.05) 0%, transparent 50%);
        }

        /* ============================================
           FLOATING GLOW ORBS
           ============================================ */
        .bg-orbs {
            position: fixed;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
            z-index: 0;
        }

        .bg-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.3;
            animation: orbFloat 10s ease-in-out infinite;
            transition: opacity 0.3s ease;
        }

        .bg-orb-1 {
            width: 350px;
            height: 350px;
            background: rgba(59, 130, 246, 0.12);
            top: -120px;
            right: -120px;
        }

        .bg-orb-2 {
            width: 280px;
            height: 280px;
            background: rgba(99, 102, 241, 0.08);
            bottom: -100px;
            left: -100px;
            animation-delay: -4s;
        }

        .bg-orb-3 {
            width: 200px;
            height: 200px;
            background: rgba(6, 182, 212, 0.06);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation-delay: -7s;
        }

        [data-theme="light"] .bg-orb-1 {
            background: rgba(59, 130, 246, 0.06);
            opacity: 0.5;
        }

        [data-theme="light"] .bg-orb-2 {
            background: rgba(99, 102, 241, 0.04);
            opacity: 0.5;
        }

        [data-theme="light"] .bg-orb-3 {
            background: rgba(6, 182, 212, 0.03);
            opacity: 0.5;
        }

        @keyframes orbFloat {

            0%,
            100% {
                transform: translate(0, 0) scale(1);
            }

            33% {
                transform: translate(50px, -50px) scale(1.2);
            }

            66% {
                transform: translate(-40px, 40px) scale(0.8);
            }
        }

        /* ============================================
           OFFLINE CONTAINER
           ============================================ */
        .offline-container {
            text-align: center;
            max-width: 480px;
            width: 100%;
            background: var(--bg-card);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-radius: 32px;
            padding: 48px 36px 40px;
            border: 1px solid var(--border);
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.3);
            position: relative;
            z-index: 1;
            animation: fadeInUp 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
            transition: background 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
        }

        [data-theme="light"] .offline-container {
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.06);
        }

        /* Premium Border Glow - Blue */
        .offline-container::before {
            content: '';
            position: absolute;
            inset: -1.5px;
            border-radius: 32px;
            background: linear-gradient(135deg,
                    rgba(59, 130, 246, 0.3) 0%,
                    rgba(99, 102, 241, 0.15) 30%,
                    rgba(6, 182, 212, 0.10) 60%,
                    rgba(59, 130, 246, 0.2) 100%);
            background-size: 300% 300%;
            animation: borderGlow 4s ease-in-out infinite;
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
            z-index: -1;
        }

        @keyframes borderGlow {

            0%,
            100% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }
        }

        [data-theme="light"] .offline-container::before {
            background: linear-gradient(135deg,
                    rgba(59, 130, 246, 0.15) 0%,
                    rgba(99, 102, 241, 0.08) 30%,
                    rgba(6, 182, 212, 0.06) 60%,
                    rgba(59, 130, 246, 0.12) 100%);
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(40px) scale(0.95);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* ============================================
           OFFLINE ICON
           ============================================ */
        .offline-icon {
            width: 100px;
            height: 100px;
            margin: 0 auto 20px;
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.12), rgba(99, 102, 241, 0.05));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3.5rem;
            color: var(--color-blue-light);
            border: 1px solid rgba(59, 130, 246, 0.08);
            animation: float 3s ease-in-out infinite;
            position: relative;
            transition: background 0.3s ease, border-color 0.3s ease, color 0.3s ease;
        }

        [data-theme="light"] .offline-icon {
            color: var(--color-blue);
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.08), rgba(99, 102, 241, 0.04));
            border-color: rgba(59, 130, 246, 0.06);
        }

        .offline-icon::after {
            content: '';
            position: absolute;
            inset: -4px;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.1), transparent);
            animation: iconRing 3s ease-in-out infinite;
            z-index: -1;
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0px);
            }

            50% {
                transform: translateY(-12px);
            }
        }

        @keyframes iconRing {

            0%,
            100% {
                opacity: 0.3;
                transform: scale(1);
            }

            50% {
                opacity: 1;
                transform: scale(1.1);
            }
        }

        .offline-icon i {
            animation: wifiPulse 2s ease-in-out infinite;
        }

        @keyframes wifiPulse {

            0%,
            100% {
                transform: scale(1);
                opacity: 1;
            }

            50% {
                transform: scale(0.9);
                opacity: 0.6;
            }
        }

        /* ============================================
           TYPOGRAPHY
           ============================================ */
        .offline-badge {
            display: inline-block;
            font-size: 0.65rem;
            font-weight: 700;
            color: var(--color-blue-light);
            background: rgba(59, 130, 246, 0.08);
            padding: 4px 16px;
            border-radius: 20px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            border: 1px solid rgba(59, 130, 246, 0.06);
            margin-bottom: 12px;
            transition: color 0.3s ease, background 0.3s ease, border-color 0.3s ease;
        }

        [data-theme="light"] .offline-badge {
            color: var(--color-blue);
            background: rgba(59, 130, 246, 0.06);
            border-color: rgba(59, 130, 246, 0.04);
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 800;
            margin-bottom: 8px;
            background: linear-gradient(135deg, var(--text-primary) 30%, var(--color-blue-light) 70%, var(--color-indigo-light));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.03em;
            transition: background 0.3s ease;
        }

        [data-theme="light"] h1 {
            background: linear-gradient(135deg, #0F172A 30%, var(--color-blue) 70%, var(--color-indigo));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .offline-subtitle {
            font-size: 1.05rem;
            color: var(--text-secondary);
            margin-bottom: 8px;
            font-weight: 400;
            transition: color 0.3s ease;
        }

        p {
            color: var(--text-muted);
            margin-bottom: 28px;
            line-height: 1.7;
            font-size: 0.9rem;
            transition: color 0.3s ease;
        }

        /* ============================================
           RETRY BUTTON
           ============================================ */
        .retry-btn {
            background: linear-gradient(135deg, var(--color-blue), var(--color-indigo));
            color: white;
            border: none;
            padding: 14px 36px;
            font-size: 0.95rem;
            font-weight: 600;
            border-radius: var(--radius-full);
            cursor: pointer;
            transition: all var(--transition-bounce, 0.3s cubic-bezier(0.34, 1.2, 0.64, 1));
            display: inline-flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 4px 20px rgba(59, 130, 246, 0.25);
            position: relative;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
        }

        [data-theme="light"] .retry-btn {
            box-shadow: 0 4px 20px rgba(59, 130, 246, 0.15);
        }

        .retry-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.15), transparent);
            transition: left 0.6s ease;
        }

        .retry-btn:hover::before {
            left: 100%;
        }

        .retry-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 35px -5px rgba(59, 130, 246, 0.35);
        }

        [data-theme="light"] .retry-btn:hover {
            box-shadow: 0 12px 35px -5px rgba(59, 130, 246, 0.25);
        }

        .retry-btn:active {
            transform: translateY(0) scale(0.97);
        }

        .retry-btn i {
            transition: transform 0.3s ease;
        }

        .retry-btn:hover i {
            transform: rotate(180deg);
        }

        /* ============================================
           OFFLINE FEATURES
           ============================================ */
        .offline-features {
            margin-top: 32px;
            padding-top: 28px;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            transition: border-color 0.3s ease;
        }

        [data-theme="light"] .offline-features {
            border-top-color: #E2E8F0;
        }

        .offline-features h3 {
            font-size: 0.8rem;
            font-weight: 700;
            margin-bottom: 16px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.06em;
            transition: color 0.3s ease;
        }

        .offline-features h3 i {
            color: var(--color-emerald, #10B981);
            margin-right: 6px;
        }

        .offline-features ul {
            list-style: none;
            text-align: left;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .offline-features li {
            color: var(--text-secondary);
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 6px 12px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.02);
            transition: all var(--transition-base);
        }

        [data-theme="light"] .offline-features li {
            background: rgba(0, 0, 0, 0.02);
            border-color: rgba(0, 0, 0, 0.02);
            color: #475569;
        }

        .offline-features li:hover {
            background: rgba(59, 130, 246, 0.04);
            border-color: rgba(59, 130, 246, 0.06);
            transform: translateX(4px);
        }

        [data-theme="light"] .offline-features li:hover {
            background: rgba(59, 130, 246, 0.04);
            border-color: rgba(59, 130, 246, 0.06);
        }

        .offline-features li:before {
            content: "✓";
            color: var(--color-emerald, #10B981);
            font-weight: 700;
            font-size: 0.7rem;
            flex-shrink: 0;
        }

        /* ============================================
           RESPONSIVE
           ============================================ */
        @media (max-width: 768px) {
            .offline-container {
                padding: 36px 24px 32px;
                border-radius: 24px;
            }

            h1 {
                font-size: 1.8rem;
            }

            .offline-icon {
                width: 80px;
                height: 80px;
                font-size: 2.8rem;
            }

            .offline-subtitle {
                font-size: 0.95rem;
            }
        }

        @media (max-width: 480px) {
            .offline-container {
                padding: 28px 16px 24px;
                border-radius: 20px;
                max-width: 95%;
            }

            h1 {
                font-size: 1.5rem;
            }

            .offline-icon {
                width: 64px;
                height: 64px;
                font-size: 2.2rem;
            }

            .offline-subtitle {
                font-size: 0.85rem;
            }

            p {
                font-size: 0.8rem;
                margin-bottom: 24px;
            }

            .offline-features ul {
                grid-template-columns: 1fr;
            }

            .offline-features li {
                font-size: 0.75rem;
                padding: 5px 10px;
            }

            .retry-btn {
                padding: 12px 28px;
                font-size: 0.85rem;
            }

            .offline-features {
                margin-top: 24px;
                padding-top: 20px;
            }

            .offline-features h3 {
                font-size: 0.7rem;
            }

            .bg-orb-1 {
                width: 150px;
                height: 150px;
                top: -50px;
                right: -50px;
            }

            .bg-orb-2 {
                width: 120px;
                height: 120px;
                bottom: -40px;
                left: -40px;
            }

            .bg-orb-3 {
                width: 100px;
                height: 100px;
            }
        }

        /* ============================================
           ACCESSIBILITY - REDUCED MOTION
           ============================================ */
        @media (prefers-reduced-motion: reduce) {

            body,
            .offline-container,
            .offline-container::before,
            .offline-icon,
            .offline-icon i,
            .offline-icon::after,
            .bg-orb,
            .retry-btn {
                animation: none !important;
                transition: none !important;
            }

            .retry-btn::before {
                display: none !important;
            }

            .retry-btn:hover {
                transform: none !important;
            }
        }
    </style>
</head>

<body>

    <!-- Floating Glow Orbs -->
    <div class="bg-orbs">
        <div class="bg-orb bg-orb-1"></div>
        <div class="bg-orb bg-orb-2"></div>
        <div class="bg-orb bg-orb-3"></div>
    </div>

    <!-- Offline Container -->
    <div class="offline-container">
        <div class="offline-icon">
            <i class="fas fa-wifi"></i>
        </div>

        <div class="offline-badge">
            <i class="fas fa-circle" style="color: #EF4444; font-size: 0.5rem; margin-right: 4px;"></i>
            Offline Mode
        </div>

        <h1>You're Offline</h1>
        <p class="offline-subtitle">But don't worry!</p>
        <p>You can still access your saved data and previously loaded content.</p>

        <button class="retry-btn" onclick="location.reload()">
            <i class="fas fa-sync-alt"></i>
            Try Again
        </button>

        <div class="offline-features">
            <h3><i class="fas fa-check-circle"></i> Available Offline:</h3>
            <ul>
                <li>View your saved anime list</li>
                <li>Check your statistics</li>
                <li>View achievements</li>
                <li>Access settings</li>
                <li>Watchlist management</li>
                <li>Profile information</li>
            </ul>
        </div>
    </div>

    <script>
        // ============================================
        // OFFLINE PAGE - Light theme detection
        // ============================================

        // Detect and apply theme
        function applyTheme() {
            const prefersLight = window.matchMedia('(prefers-color-scheme: light)').matches;
            const html = document.documentElement;

            if (prefersLight) {
                html.setAttribute('data-theme', 'light');
            } else {
                html.removeAttribute('data-theme');
            }
        }

        // Listen for theme changes
        window.matchMedia('(prefers-color-scheme: light)').addEventListener('change', applyTheme);

        // Apply on load
        document.addEventListener('DOMContentLoaded', applyTheme);

        console.log('✅ Offline page initialized');
    </script>
</body>

</html>
