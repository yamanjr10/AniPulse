<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found - AniPulse</title>

    <!-- Theme -->
    <meta name="theme-color" content="#0b1120" />
    <meta name="color-scheme" content="dark light" />

    <!-- Main Browser Icon -->
    <link rel="shortcut icon" href="/Frontend/icon/icon-72x72.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/Frontend/icon/icon-72x72.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/Frontend/icon/icon-72x72.png" />

    <!-- PWA Icons -->
    <link rel="apple-touch-icon" sizes="72x72" href="/Frontend/icon/icon-72x72.png" />
    <link rel="apple-touch-icon" sizes="96x96" href="/Frontend/icon/icon-96x96.png" />
    <link rel="apple-touch-icon" sizes="128x128" href="/Frontend/icon/icon-128x128.png" />
    <link rel="apple-touch-icon" sizes="144x144" href="/Frontend/icon/icon-144x144.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/Frontend/icon/icon-152x152.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/Frontend/icon/icon-192x192.png" />
    <link rel="apple-touch-icon" sizes="384x384" href="/Frontend/icon/icon-384x384.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/Frontend/icon/icon-512x512.png" />

    <!-- Windows Tile -->
    <meta name="msapplication-TileColor" content="#6366F1" />
    <meta name="msapplication-TileImage" content="/Frontend/icon/icon-192x192.png" />

    <!-- Disable Cache -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800;14..32,900&display=swap"
        rel="stylesheet">

    <style>
        /* ============================================
           404 PAGE - Premium Blue Theme
           ============================================ */

        /* ============================================
           CSS VARIABLES
           ============================================ */
        :root {
            --color-blue: #3B82F6;
            --color-blue-dark: #2563EB;
            --color-blue-light: #60A5FA;
            --color-indigo: #6366F1;
            --color-indigo-light: #818CF8;
            --color-cyan: #06B6D4;
            --color-cyan-light: #67E8F9;
            --color-violet: #8B5CF6;
            --color-violet-light: #A78BFA;

            --bg-body: #0B1120;
            --bg-glass: rgba(30, 41, 59, 0.7);
            --bg-card: rgba(15, 23, 42, 0.6);

            --text-primary: #F8FAFC;
            --text-secondary: #94A3B8;
            --text-muted: #64748B;

            --border: rgba(59, 130, 246, 0.12);
            --border-hover: rgba(59, 130, 246, 0.3);

            --shadow-glow: 0 8px 32px rgba(59, 130, 246, 0.15);
            --radius-full: 9999px;
            --transition-base: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        [data-theme="light"] {
            --bg-body: #F8FAFC;
            --bg-glass: rgba(255, 255, 255, 0.7);
            --bg-card: rgba(255, 255, 255, 0.8);

            --text-primary: #0F172A;
            --text-secondary: #475569;
            --text-muted: #94A3B8;

            --border: rgba(59, 130, 246, 0.08);
            --border-hover: rgba(59, 130, 246, 0.3);

            --shadow-glow: 0 8px 32px rgba(59, 130, 246, 0.08);
        }

        /* ============================================
           RESET & BASE
           ============================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-body);
            background-image: radial-gradient(ellipse at 10% 20%, rgba(59, 130, 246, 0.06) 0%, transparent 50%),
                radial-gradient(ellipse at 90% 80%, rgba(6, 182, 212, 0.04) 0%, transparent 50%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
            transition: background 0.3s ease;
        }

        [data-theme="light"] body {
            background-image: radial-gradient(ellipse at 10% 20%, rgba(59, 130, 246, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 90% 80%, rgba(6, 182, 212, 0.05) 0%, transparent 50%);
        }

        /* ============================================
           FLOATING GLOW ORBS
           ============================================ */
        .bg-orbs {
            position: fixed;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
            z-index: 0;
        }

        .bg-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.3;
            animation: orbFloat 10s ease-in-out infinite;
            transition: opacity 0.3s ease;
        }

        .bg-orb-1 {
            width: 350px;
            height: 350px;
            background: rgba(59, 130, 246, 0.12);
            top: -120px;
            right: -120px;
        }

        .bg-orb-2 {
            width: 280px;
            height: 280px;
            background: rgba(99, 102, 241, 0.08);
            bottom: -100px;
            left: -100px;
            animation-delay: -4s;
        }

        .bg-orb-3 {
            width: 200px;
            height: 200px;
            background: rgba(6, 182, 212, 0.06);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation-delay: -7s;
        }

        [data-theme="light"] .bg-orb-1 {
            background: rgba(59, 130, 246, 0.06);
            opacity: 0.5;
        }

        [data-theme="light"] .bg-orb-2 {
            background: rgba(99, 102, 241, 0.04);
            opacity: 0.5;
        }

        [data-theme="light"] .bg-orb-3 {
            background: rgba(6, 182, 212, 0.03);
            opacity: 0.5;
        }

        @keyframes orbFloat {

            0%,
            100% {
                transform: translate(0, 0) scale(1);
            }

            33% {
                transform: translate(50px, -50px) scale(1.2);
            }

            66% {
                transform: translate(-40px, 40px) scale(0.8);
            }
        }

        /* ============================================
           CONTAINER
           ============================================ */
        .container {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: 2rem;
            max-width: 600px;
            width: 90%;
            background: var(--bg-card);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-radius: 32px;
            border: 1px solid var(--border);
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.3);
            animation: fadeInUp 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
            transition: background 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
        }

        [data-theme="light"] .container {
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.06);
        }

        /* Gradient Border */
        .container::before {
            content: '';
            position: absolute;
            inset: -1.5px;
            border-radius: 32px;
            background: linear-gradient(135deg,
                    rgba(59, 130, 246, 0.3) 0%,
                    rgba(99, 102, 241, 0.15) 30%,
                    rgba(6, 182, 212, 0.10) 60%,
                    rgba(59, 130, 246, 0.2) 100%);
            background-size: 300% 300%;
            animation: borderGlow 4s ease-in-out infinite;
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
            z-index: -1;
        }

        @keyframes borderGlow {

            0%,
            100% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }
        }

        [data-theme="light"] .container::before {
            background: linear-gradient(135deg,
                    rgba(59, 130, 246, 0.15) 0%,
                    rgba(99, 102, 241, 0.08) 30%,
                    rgba(6, 182, 212, 0.06) 60%,
                    rgba(59, 130, 246, 0.12) 100%);
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(40px) scale(0.95);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* ============================================
           ERROR CODE
           ============================================ */
        .error-code {
            font-size: 8rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--color-blue), var(--color-indigo), var(--color-cyan), var(--color-blue));
            background-size: 300% 300%;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradientShift 3s ease infinite;
            letter-spacing: -5px;
            margin-bottom: 0.5rem;
        }

        [data-theme="light"] .error-code {
            background: linear-gradient(135deg, var(--color-blue), var(--color-indigo), var(--color-cyan), var(--color-blue));
            background-size: 300% 300%;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        @keyframes gradientShift {

            0%,
            100% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }
        }

        .error-code::after {
            content: '';
            display: block;
            width: 100px;
            height: 4px;
            background: linear-gradient(90deg, var(--color-blue), var(--color-indigo), var(--color-cyan));
            margin: 20px auto 0;
            border-radius: 4px;
            animation: expandWidth 0.6s ease-out;
        }

        @keyframes expandWidth {
            from {
                width: 0;
                opacity: 0;
            }

            to {
                width: 100px;
                opacity: 1;
            }
        }

        /* ============================================
           LOST ICON
           ============================================ */
        .lost-icon {
            font-size: 5rem;
            margin: 1rem 0;
            display: inline-block;
            animation: bounce 2s ease-in-out infinite;
            color: var(--color-blue-light);
        }

        [data-theme="light"] .lost-icon {
            color: var(--color-blue);
        }

        @keyframes bounce {

            0%,
            100% {
                transform: translateY(0) rotate(0deg);
            }

            50% {
                transform: translateY(-15px) rotate(5deg);
            }
        }

        /* ============================================
           TYPOGRAPHY
           ============================================ */
        .title {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 1rem;
            transition: color 0.3s ease;
        }

        .message {
            color: var(--text-secondary);
            font-size: 1rem;
            line-height: 1.6;
            margin-bottom: 1.5rem;
            transition: color 0.3s ease;
        }

        /* ============================================
           SEARCH BOX
           ============================================ */
        .search-box {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border);
            border-radius: var(--radius-full);
            padding: 0.8rem 1.5rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 2rem;
            transition: all var(--transition-base);
        }

        .search-box:focus-within {
            border-color: var(--color-blue);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
            background: rgba(255, 255, 255, 0.06);
        }

        [data-theme="light"] .search-box {
            background: white;
            border-color: #E2E8F0;
        }

        [data-theme="light"] .search-box:focus-within {
            background: white;
            border-color: var(--color-blue);
        }

        .search-box i {
            color: var(--color-blue-light);
            font-size: 1.2rem;
        }

        [data-theme="light"] .search-box i {
            color: var(--color-blue);
        }

        .search-box input {
            flex: 1;
            background: none;
            border: none;
            color: var(--text-primary);
            font-size: 0.95rem;
            outline: none;
            font-family: 'Inter', sans-serif;
        }

        .search-box input::placeholder {
            color: var(--text-muted);
        }

        /* ============================================
           BUTTONS
           ============================================ */
        .button-group {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 2rem;
        }

        .btn {
            padding: 0.75rem 1.8rem;
            border-radius: var(--radius-full);
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all var(--transition-bounce, 0.3s cubic-bezier(0.34, 1.2, 0.64, 1));
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            text-decoration: none;
            font-family: 'Inter', sans-serif;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--color-blue), var(--color-indigo));
            color: white;
            border: none;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.25);
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(59, 130, 246, 0.35);
        }

        [data-theme="light"] .btn-primary {
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.15);
        }

        [data-theme="light"] .btn-primary:hover {
            box-shadow: 0 8px 25px rgba(59, 130, 246, 0.25);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.04);
            color: var(--text-secondary);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: var(--color-blue);
            transform: translateY(-3px);
        }

        [data-theme="light"] .btn-secondary {
            background: rgba(0, 0, 0, 0.02);
            border-color: #E2E8F0;
            color: #475569;
        }

        [data-theme="light"] .btn-secondary:hover {
            background: rgba(0, 0, 0, 0.04);
            border-color: var(--color-blue);
        }

        /* ============================================
           SUGGESTIONS
           ============================================ */
        .suggestions {
            text-align: left;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 16px;
            padding: 1.5rem;
            margin-top: 1rem;
            transition: background 0.3s ease;
        }

        [data-theme="light"] .suggestions {
            background: white;
        }

        .suggestions-title {
            color: var(--color-blue-light);
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: color 0.3s ease;
        }

        [data-theme="light"] .suggestions-title {
            color: var(--color-blue);
        }

        .suggestions-list {
            display: flex;
            flex-wrap: wrap;
            gap: 0.8rem;
        }

        .suggestion-tag {
            background: rgba(59, 130, 246, 0.08);
            color: var(--color-blue-light);
            padding: 0.5rem 1rem;
            border-radius: var(--radius-full);
            font-size: 0.85rem;
            cursor: pointer;
            transition: all var(--transition-base);
            border: 1px solid rgba(59, 130, 246, 0.08);
        }

        .suggestion-tag:hover {
            background: rgba(59, 130, 246, 0.15);
            transform: translateY(-2px);
            border-color: var(--color-blue);
        }

        [data-theme="light"] .suggestion-tag {
            background: rgba(59, 130, 246, 0.04);
            color: var(--color-blue);
            border-color: rgba(59, 130, 246, 0.06);
        }

        [data-theme="light"] .suggestion-tag:hover {
            background: rgba(59, 130, 246, 0.08);
            border-color: var(--color-blue);
        }

        /* ============================================
           FUN FACT
           ============================================ */
        .fun-fact {
            margin-top: 2rem;
            padding: 1rem;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            font-size: 0.8rem;
            color: var(--text-muted);
            transition: border-color 0.3s ease, color 0.3s ease;
        }

        [data-theme="light"] .fun-fact {
            border-top-color: #E2E8F0;
        }

        .fun-fact i {
            margin-right: 0.5rem;
            color: var(--color-blue-light);
        }

        [data-theme="light"] .fun-fact i {
            color: var(--color-blue);
        }

        /* ============================================
           RESPONSIVE
           ============================================ */
        @media (max-width: 768px) {
            .container {
                padding: 1.5rem;
                border-radius: 24px;
            }

            .error-code {
                font-size: 5rem;
                letter-spacing: -3px;
            }

            .title {
                font-size: 1.3rem;
            }

            .message {
                font-size: 0.9rem;
            }

            .button-group {
                gap: 0.8rem;
            }

            .btn {
                padding: 0.6rem 1.3rem;
                font-size: 0.85rem;
            }

            .suggestions-list {
                justify-content: center;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 1.25rem;
                border-radius: 20px;
                max-width: 95%;
            }

            .error-code {
                font-size: 4rem;
            }

            .lost-icon {
                font-size: 3.5rem;
            }

            .title {
                font-size: 1.1rem;
            }

            .message {
                font-size: 0.8rem;
            }

            .search-box {
                padding: 0.6rem 1rem;
                gap: 0.7rem;
            }

            .search-box input {
                font-size: 0.8rem;
            }

            .btn {
                padding: 0.5rem 1rem;
                font-size: 0.75rem;
                gap: 0.3rem;
            }

            .suggestion-tag {
                font-size: 0.7rem;
                padding: 0.3rem 0.7rem;
            }

            .bg-orb-1 {
                width: 150px;
                height: 150px;
                top: -50px;
                right: -50px;
            }

            .bg-orb-2 {
                width: 120px;
                height: 120px;
                bottom: -40px;
                left: -40px;
            }

            .bg-orb-3 {
                width: 100px;
                height: 100px;
            }
        }

        /* ============================================
           ACCESSIBILITY - REDUCED MOTION
           ============================================ */
        @media (prefers-reduced-motion: reduce) {

            body,
            .container,
            .container::before,
            .error-code,
            .lost-icon,
            .bg-orb,
            .btn {
                animation: none !important;
                transition: none !important;
            }

            .error-code::after {
                animation: none !important;
            }

            .btn:hover {
                transform: none !important;
            }

            .suggestion-tag:hover {
                transform: none !important;
            }
        }
    </style>
</head>

<body>

    <!-- Animated Particles -->
    <div class="bg-orbs">
        <div class="bg-orb bg-orb-1"></div>
        <div class="bg-orb bg-orb-2"></div>
        <div class="bg-orb bg-orb-3"></div>
    </div>

    <div class="container">
        <!-- 404 Code -->
        <div class="error-code">404</div>

        <!-- Lost Icon -->
        <div class="lost-icon">
            <i class="fas fa-compass"></i>
        </div>

        <h1 class="title">Page Not Found</h1>

        <p class="message">
            Oops! The page you're looking for seems to have wandered off into another dimension.<br>
            Don't worry, we'll help you find your way back.
        </p>

        <!-- Action Buttons -->
        <div class="button-group">
            <button class="btn btn-primary" id="goHomeBtn">
                <i class="fas fa-home"></i> Home
            </button>
            <button class="btn btn-secondary" id="goBackBtn">
                <i class="fas fa-arrow-left"></i> Go Back
            </button>
            <button class="btn btn-secondary" id="reportBtn">
                <i class="fas fa-flag"></i> Report Issue
            </button>
        </div>

        <!-- Fun Fact -->
        <div class="fun-fact">
            <i class="fas fa-info-circle"></i>
            <span id="funFact">Did you know? The average anime fan watches over 100 hours of anime per year!</span>
        </div>
    </div>

    <script>
        // ============================================
        // 404 ERROR PAGE - CORRECT NAVIGATION
        // ============================================

        // Page mapping
        const PAGE_MAPPING = {
            'dashboard': 'dashboard',
            'anime-list': 'anime-list',
            'watchlist': 'watchlist',
            'statistics': 'statistics',
            'achievements': 'achievements',
            'community': 'community',
            'settings': 'settings'
        };

        // Fun facts array
        const funFacts = [
            "Did you know? The average anime fan watches over 100 hours of anime per year!",
            "One Piece has over 1000+ episodes - that's about 400 hours of content!",
            "The word 'anime' is the Japanese term for animation, derived from 'animation'.",
            "Studio Ghibli's 'Spirited Away' was the first anime to win an Academy Award.",
            "The most expensive anime ever made is 'Steamboy' with a budget of $22 million.",
            "\"Your Name\" (Kimi no Na wa) is the highest-grossing anime film worldwide.",
            "The first anime ever made was 'Namakura Gatana' (The Dull Sword) in 1917.",
            "Doraemon is Japan's longest-running anime, starting in 1973.",
            "Anime voice actors in Japan can earn up to $80,000 per episode!",
            "The 'Dragon Ball' franchise is worth over $27 billion globally."
        ];

        // Navigate to specific page in dashboard
        function navigateToPage(page) {
            localStorage.setItem('redirectToPage', page);
            sessionStorage.setItem('activePage', page);
            console.log('🔄 Navigating to:', page);
            window.location.href = '/dashboard.html?page=' + page;
        }

        // Go to dashboard home
        function goToDashboard() {
            localStorage.removeItem('redirectToPage');
            sessionStorage.removeItem('activePage');
            console.log('🏠 Navigating to Dashboard Home');
            window.location.href = '/dashboard.html';
        }

        // Search functionality
        function searchAnime(query) {
            if (!query.trim()) return;
            localStorage.setItem('pendingSearch', query);
            showMessage('Searching for "' + query + '"...', 'info');
            setTimeout(() => {
                window.location.href = '/dashboard.html?search=' + encodeURIComponent(query);
            }, 300);
        }

        // Show message
        function showMessage(message, type) {
            const toast = document.createElement('div');
            toast.textContent = message;
            toast.style.position = 'fixed';
            toast.style.bottom = '20px';
            toast.style.left = '50%';
            toast.style.transform = 'translateX(-50%)';
            toast.style.background = type === 'error' ? '#EF4444' : 'var(--color-blue)';
            toast.style.color = 'white';
            toast.style.padding = '12px 24px';
            toast.style.borderRadius = '50px';
            toast.style.fontSize = '0.9rem';
            toast.style.fontWeight = '500';
            toast.style.zIndex = '9999';
            toast.style.animation = 'fadeInUp 0.3s ease';
            document.body.appendChild(toast);

            setTimeout(() => {
                toast.style.opacity = '0';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // Report 404 issue
        function reportIssue() {
            const currentUrl = window.location.href;
            const reportData = {
                url: currentUrl,
                timestamp: new Date().toISOString(),
                userAgent: navigator.userAgent
            };
            const reports = JSON.parse(localStorage.getItem('404Reports') || '[]');
            reports.push(reportData);
            localStorage.setItem('404Reports', JSON.stringify(reports.slice(-20)));
            showMessage('Thank you! This issue has been reported.', 'success');
            console.log('404 Report:', reportData);
        }

        // Rotate fun facts
        function rotateFunFacts() {
            let index = 0;
            setInterval(() => {
                index = (index + 1) % funFacts.length;
                const factElement = document.getElementById('funFact');
                if (factElement) {
                    factElement.style.opacity = '0';
                    setTimeout(() => {
                        factElement.textContent = funFacts[index];
                        factElement.style.opacity = '1';
                    }, 300);
                }
            }, 10000);
        }

        // Initialize
        function init() {
            rotateFunFacts();

            const goHomeBtn = document.getElementById('goHomeBtn');
            const goBackBtn = document.getElementById('goBackBtn');
            const reportBtn = document.getElementById('reportBtn');
            const searchInput = document.getElementById('searchInput');
            const searchIcon = document.getElementById('searchIcon');
            const suggestionTags = document.querySelectorAll('.suggestion-tag');

            if (goHomeBtn) goHomeBtn.addEventListener('click', goToDashboard);
            if (goBackBtn) goBackBtn.addEventListener('click', () => window.history.back());
            if (reportBtn) reportBtn.addEventListener('click', reportIssue);

            if (searchInput) {
                searchInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') searchAnime(searchInput.value);
                });
            }
            if (searchIcon) {
                searchIcon.addEventListener('click', () => searchAnime(searchInput.value));
            }

            suggestionTags.forEach(tag => {
                tag.addEventListener('click', () => {
                    const page = tag.getAttribute('data-page');
                    if (page && PAGE_MAPPING[page]) {
                        navigateToPage(page);
                    } else if (page === 'dashboard') {
                        goToDashboard();
                    } else {
                        goToDashboard();
                    }
                });
            });

            console.log('✅ 404 Page initialized');
        }

        document.addEventListener('DOMContentLoaded', init);

        // Parallax effect for particles
        document.addEventListener('mousemove', (e) => {
            const orbs = document.querySelectorAll('.bg-orb');
            const mouseX = e.clientX / window.innerWidth;
            const mouseY = e.clientY / window.innerHeight;

            orbs.forEach((orb, index) => {
                const speed = (index + 1) * 8;
                const x = (mouseX - 0.5) * speed;
                const y = (mouseY - 0.5) * speed;
                orb.style.transform = `translate(${x}px, ${y}px)`;
            });
        });
    </script>
</body>

</html>
