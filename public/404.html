<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | AniPulse</title>

    <!-- Theme -->
    <meta name="theme-color" content="#0b1120" />
    <meta name="color-scheme" content="dark light" />

     <!-- Main Browser Icon -->
    <link rel="shortcut icon" href="/Frontend/icon/icon-72x72.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/Frontend/icon/icon-72x72.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/Frontend/icon/icon-72x72.png" />

    <!-- PWA Icons -->
    <link rel="apple-touch-icon" sizes="72x72" href="/Frontend/icon/icon-72x72.png" />
    <link rel="apple-touch-icon" sizes="96x96" href="/Frontend/icon/icon-96x96.png" />
    <link rel="apple-touch-icon" sizes="128x128" href="/Frontend/icon/icon-128x128.png" />
    <link rel="apple-touch-icon" sizes="144x144" href="/Frontend/icon/icon-144x144.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/Frontend/icon/icon-152x152.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/Frontend/icon/icon-192x192.png" />
    <link rel="apple-touch-icon" sizes="384x384" href="/Frontend/icon/icon-384x384.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/Frontend/icon/icon-512x512.png" />

    <!-- Windows Tile -->
    <meta name="msapplication-TileColor" content="#6366F1" />
    <meta name="msapplication-TileImage" content="/Frontend/icon/icon-192x192.png" />

    <!-- Disable Cache -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0B0F1A 0%, #1A1F2E 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow-x: hidden;
        }

        /* Animated background particles */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            background: rgba(99, 102, 241, 0.3);
            border-radius: 50%;
            animation: float 15s infinite ease-in-out;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0) translateX(0);
                opacity: 0.3;
            }
            25% {
                transform: translateY(-30px) translateX(20px);
                opacity: 0.6;
            }
            50% {
                transform: translateY(10px) translateX(-20px);
                opacity: 0.4;
            }
            75% {
                transform: translateY(-10px) translateX(10px);
                opacity: 0.7;
            }
        }

        .container {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: 2rem;
            max-width: 600px;
            width: 90%;
            animation: fadeInUp 0.6s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 404 Number Animation */
        .error-code {
            font-size: 8rem;
            font-weight: 800;
            background: linear-gradient(135deg, #6366F1, #8B5CF6, #A78BFA, #6366F1);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradientShift 3s ease infinite;
            letter-spacing: -5px;
            margin-bottom: 0.5rem;
        }

        @keyframes gradientShift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .error-code::after {
            content: '';
            display: block;
            width: 100px;
            height: 4px;
            background: linear-gradient(90deg, #6366F1, #8B5CF6, #A78BFA);
            margin: 20px auto 0;
            border-radius: 4px;
            animation: expandWidth 0.6s ease-out;
        }

        @keyframes expandWidth {
            from { width: 0; opacity: 0; }
            to { width: 100px; opacity: 1; }
        }

        .lost-icon {
            font-size: 5rem;
            margin: 1rem 0;
            display: inline-block;
            animation: bounce 2s ease-in-out infinite;
        }

        @keyframes bounce {
            0%, 100% {
                transform: translateY(0) rotate(0deg);
            }
            50% {
                transform: translateY(-15px) rotate(5deg);
            }
        }

        .title {
            font-size: 1.8rem;
            font-weight: 700;
            color: #FFFFFF;
            margin-bottom: 1rem;
        }

        .message {
            color: #94A3B8;
            font-size: 1rem;
            line-height: 1.6;
            margin-bottom: 1.5rem;
        }

        /* Search Box */
        .search-box {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(139, 92, 246, 0.3);
            border-radius: 50px;
            padding: 0.8rem 1.5rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 2rem;
            transition: all 0.3s ease;
        }

        .search-box:focus-within {
            border-color: #8B5CF6;
            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.2);
            background: rgba(255, 255, 255, 0.12);
        }

        .search-box i {
            color: #8B5CF6;
            font-size: 1.2rem;
        }

        .search-box input {
            flex: 1;
            background: none;
            border: none;
            color: white;
            font-size: 0.95rem;
            outline: none;
        }

        .search-box input::placeholder {
            color: #64748B;
        }

        /* Button Container */
        .button-group {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 2rem;
        }

        .btn {
            padding: 0.75rem 1.8rem;
            border-radius: 50px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            text-decoration: none;
        }

        .btn-primary {
            background: linear-gradient(135deg, #6366F1, #8B5CF6);
            color: white;
            border: none;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(99, 102, 241, 0.4);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.08);
            color: white;
            border: 1px solid rgba(139, 92, 246, 0.3);
        }

        .btn-secondary:hover {
            background: rgba(139, 92, 246, 0.15);
            border-color: #8B5CF6;
            transform: translateY(-3px);
        }

        /* Suggestions Section */
        .suggestions {
            text-align: left;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 16px;
            padding: 1.5rem;
            margin-top: 1rem;
        }

        .suggestions-title {
            color: #A78BFA;
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .suggestions-list {
            display: flex;
            flex-wrap: wrap;
            gap: 0.8rem;
        }

        .suggestion-tag {
            background: rgba(99, 102, 241, 0.1);
            color: #A78BFA;
            padding: 0.5rem 1rem;
            border-radius: 50px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s ease;
            border: 1px solid rgba(139, 92, 246, 0.2);
        }

        .suggestion-tag:hover {
            background: rgba(99, 102, 241, 0.2);
            transform: translateY(-2px);
            border-color: #8B5CF6;
        }

        /* Fun Fact Section */
        .fun-fact {
            margin-top: 2rem;
            padding: 1rem;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            font-size: 0.8rem;
            color: #64748B;
        }

        .fun-fact i {
            margin-right: 0.5rem;
            color: #8B5CF6;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .error-code {
                font-size: 5rem;
                letter-spacing: -3px;
            }
            
            .title {
                font-size: 1.3rem;
            }
            
            .message {
                font-size: 0.9rem;
            }
            
            .button-group {
                gap: 0.8rem;
            }
            
            .btn {
                padding: 0.6rem 1.3rem;
                font-size: 0.85rem;
            }
            
            .suggestions-list {
                justify-content: center;
            }
        }

        /* Light mode support */
        @media (prefers-color-scheme: light) {
            body {
                background: linear-gradient(135deg, #F8FAFC 0%, #E2E8F0 100%);
            }
            
            .title {
                color: #1E293B;
            }
            
            .message {
                color: #475569;
            }
            
            .search-box {
                background: white;
                border-color: #E2E8F0;
            }
            
            .search-box input {
                color: #1E293B;
            }
            
            .search-box input::placeholder {
                color: #94A3B8;
            }
            
            .suggestions {
                background: white;
            }
            
            .fun-fact {
                border-top-color: #E2E8F0;
                color: #64748B;
            }
        }
    </style>
</head>
<body>

    <!-- Animated Particles -->
    <div class="particles" id="particles"></div>

    <div class="container">
        <!-- 404 Code -->
        <div class="error-code">404</div>
        
        <!-- Lost Icon -->
        <div class="lost-icon">
            <i class="fas fa-compass"></i>
        </div>
        
        <h1 class="title">Page Not Found</h1>
        
        <p class="message">
            Oops! The page you're looking for seems to have wandered off into another dimension.<br>
            Don't worry, we'll help you find your way back.
        </p>
        
        <!-- Action Buttons -->
        <div class="button-group">
            <button class="btn btn-primary" id="goHomeBtn">
                <i class="fas fa-home"></i> Home
            </button>
            <button class="btn btn-secondary" id="goBackBtn">
                <i class="fas fa-arrow-left"></i> Go Back
            </button>
            <button class="btn btn-secondary" id="reportBtn">
                <i class="fas fa-flag"></i> Report Issue
            </button>
        </div>
        
        <!-- Fun Fact -->
        <div class="fun-fact">
            <i class="fas fa-info-circle"></i>
            <span id="funFact">Did you know? The average anime fan watches over 100 hours of anime per year!</span>
        </div>
    </div>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        // ============================================
        // 404 ERROR PAGE - CORRECT NAVIGATION
        // ============================================

        // Page mapping - these match the data-page attributes in your dashboard
        const PAGE_MAPPING = {
            'dashboard': 'dashboard',
            'anime-list': 'anime-list',
            'watchlist': 'watchlist',
            'statistics': 'statistics',
            'achievements': 'achievements',
            'community': 'community',
            'settings': 'settings'
        };

        // Fun facts array
        const funFacts = [
            "Did you know? The average anime fan watches over 100 hours of anime per year!",
            "One Piece has over 1000+ episodes - that's about 400 hours of content!",
            "The word 'anime' is the Japanese term for animation, derived from 'animation'.",
            "Studio Ghibli's 'Spirited Away' was the first anime to win an Academy Award.",
            "The most expensive anime ever made is 'Steamboy' with a budget of $22 million.",
            "\"Your Name\" (Kimi no Na wa) is the highest-grossing anime film worldwide.",
            "The first anime ever made was 'Namakura Gatana' (The Dull Sword) in 1917.",
            "Doraemon is Japan's longest-running anime, starting in 1973.",
            "Anime voice actors in Japan can earn up to $80,000 per episode!",
            "The 'Dragon Ball' franchise is worth over $27 billion globally."
        ];

        // Create animated background particles
        function createParticles() {
            const container = document.getElementById('particles');
            const particleCount = 50;
            
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                const size = Math.random() * 15 + 5;
                particle.style.width = size + 'px';
                particle.style.height = size + 'px';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.top = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 15 + 's';
                particle.style.animationDuration = (Math.random() * 10 + 10) + 's';
                particle.style.opacity = Math.random() * 0.3;
                container.appendChild(particle);
            }
        }

        // Change fun fact every 10 seconds
        function rotateFunFacts() {
            let index = 0;
            setInterval(() => {
                index = (index + 1) % funFacts.length;
                const factElement = document.getElementById('funFact');
                if (factElement) {
                    factElement.style.opacity = '0';
                    setTimeout(() => {
                        factElement.textContent = funFacts[index];
                        factElement.style.opacity = '1';
                    }, 300);
                }
            }, 10000);
        }

        // Navigate to specific page in dashboard
        function navigateToPage(page) {
            // Store which page to show in localStorage
            localStorage.setItem('redirectToPage', page);
            
            // Also store in sessionStorage as backup
            sessionStorage.setItem('activePage', page);
            
            console.log('🔄 Navigating to:', page);
            
            // Navigate to dashboard with page parameter
            window.location.href = '/dashboard.html?page=' + page;
        }

        // Go to dashboard home
        function goToDashboard() {
            // Clear any stored page preference
            localStorage.removeItem('redirectToPage');
            sessionStorage.removeItem('activePage');
            
            console.log('🏠 Navigating to Dashboard Home');
            window.location.href = '/dashboard.html';
        }

        // Search functionality
        function searchAnime(query) {
            if (!query.trim()) return;
            
            // Store search query for dashboard
            localStorage.setItem('pendingSearch', query);
            
            showMessage('Searching for "' + query + '"...', 'info');
            
            // Navigate to dashboard with search param
            setTimeout(() => {
                window.location.href = '/dashboard.html?search=' + encodeURIComponent(query);
            }, 300);
        }

        // Simple message display
        function showMessage(message, type) {
            const toast = document.createElement('div');
            toast.textContent = message;
            toast.style.position = 'fixed';
            toast.style.bottom = '20px';
            toast.style.left = '50%';
            toast.style.transform = 'translateX(-50%)';
            toast.style.background = type === 'error' ? '#EF4444' : '#6366F1';
            toast.style.color = 'white';
            toast.style.padding = '12px 24px';
            toast.style.borderRadius = '50px';
            toast.style.fontSize = '0.9rem';
            toast.style.fontWeight = '500';
            toast.style.zIndex = '9999';
            toast.style.animation = 'fadeInUp 0.3s ease';
            document.body.appendChild(toast);
            
            setTimeout(() => {
                toast.style.opacity = '0';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // Report 404 issue
        function reportIssue() {
            const currentUrl = window.location.href;
            const reportData = {
                url: currentUrl,
                timestamp: new Date().toISOString(),
                userAgent: navigator.userAgent
            };
            
            const reports = JSON.parse(localStorage.getItem('404Reports') || '[]');
            reports.push(reportData);
            localStorage.setItem('404Reports', JSON.stringify(reports.slice(-20)));
            
            showMessage('Thank you! This issue has been reported.', 'success');
            console.log('404 Report:', reportData);
        }

        // Initialize page
        function init() {
            createParticles();
            rotateFunFacts();
            
            // Add event listeners
            const goHomeBtn = document.getElementById('goHomeBtn');
            const goBackBtn = document.getElementById('goBackBtn');
            const reportBtn = document.getElementById('reportBtn');
            const searchInput = document.getElementById('searchInput');
            const searchIcon = document.getElementById('searchIcon');
            const suggestionTags = document.querySelectorAll('.suggestion-tag');
            
            if (goHomeBtn) {
                goHomeBtn.addEventListener('click', goToDashboard);
            }
            
            if (goBackBtn) {
                goBackBtn.addEventListener('click', () => {
                    window.history.back();
                });
            }
            
            if (reportBtn) {
                reportBtn.addEventListener('click', reportIssue);
            }
            
            if (searchInput) {
                searchInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') {
                        searchAnime(searchInput.value);
                    }
                });
            }
            
            if (searchIcon) {
                searchIcon.addEventListener('click', () => {
                    searchAnime(searchInput.value);
                });
            }
            
            // Handle suggestion clicks - CORRECTED NAVIGATION
            suggestionTags.forEach(tag => {
                tag.addEventListener('click', () => {
                    const page = tag.getAttribute('data-page');
                    if (page && PAGE_MAPPING[page]) {
                        navigateToPage(page);
                    } else if (page === 'dashboard') {
                        goToDashboard();
                    } else {
                        console.log('Unknown page:', page);
                        goToDashboard();
                    }
                });
            });
            
            console.log('✅ 404 Page initialized');
        }

        // Run when DOM is ready
        document.addEventListener('DOMContentLoaded', init);
        
        // Parallax effect for particles
        document.addEventListener('mousemove', (e) => {
            const particles = document.querySelectorAll('.particle');
            const mouseX = e.clientX / window.innerWidth;
            const mouseY = e.clientY / window.innerHeight;
            
            particles.forEach((particle, index) => {
                const speed = (index % 5 + 1) * 5;
                const x = (mouseX - 0.5) * speed;
                const y = (mouseY - 0.5) * speed;
                particle.style.transform = `translate(${x}px, ${y}px)`;
            });
        });
    </script>
</body>
</html>
