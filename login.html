<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AniPulse - Login</title>
    <link rel="stylesheet" href="/Frontend/Css/pages/auth.css" />

    <!-- Fonts & Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800;14..32,900&display=swap" rel="stylesheet" />

    <!-- Theme & PWA Meta -->
    <meta name="theme-color" content="#0b1120" />
    <meta name="color-scheme" content="dark light" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="AniPulse" />
    <link rel="shortcut icon" href="/Frontend/icon/icon-72x72.png" />
    <link rel="apple-touch-icon" sizes="72x72" href="/Frontend/icon/icon-72x72.png" />
    <link rel="manifest" href="/manifest.json" />

    <!-- ===== FIREBASE SDK (loaded before any custom scripts) ===== -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

    <!-- ===== CONFIG (must be loaded before firebase-init) ===== -->
    <script defer src="/Frontend/Js/services/config.js"></script>

    <!-- Firebase initializer – fetches config from backend -->
    <script src="/Frontend/Js/firebase-init.js" defer></script>
</head>
<body>

    <!-- Floating Orbs -->
    <div class="bg-orbs">
        <div class="bg-orb bg-orb-1"></div>
        <div class="bg-orb bg-orb-2"></div>
        <div class="bg-orb bg-orb-3"></div>
    </div>

    <!-- Auth Card -->
    <div class="auth-card">
        <div class="logo">
            <div class="logo-icon"><i class="fas fa-heartbeat"></i></div>
            <h1>AniPulse</h1>
            <p class="subtitle">Track. Analyze. Connect.</p>
        </div>

        <div style="text-align: center;">
            <span class="mode-badge" id="modeBadge">🔐 Sign In</span>
        </div>

        <div id="messageDiv"></div>

        <form id="authForm">
            <div class="form-group" id="usernameGroup" style="display: none;">
                <label>Username</label>
                <input type="text" id="username" placeholder="Choose a username" />
            </div>
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="email" placeholder="Enter your email" required />
            </div>
            <div class="form-group">
                <label>Password</label>
                <div class="password-wrapper">
                    <input type="password" id="password" placeholder="Enter your password" required />
                    <button type="button" class="password-toggle" id="passwordToggle" aria-label="Toggle password visibility">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
            </div>
            <button type="submit" class="btn" id="submitBtn">
                <i class="fas fa-sign-in-alt"></i> Login
            </button>
        </form>

        <!-- Divider -->
        <div class="divider"><span>OR</span></div>

        <!-- Google Sign-In -->
        <button type="button" class="btn btn-google" id="googleSignInBtn">
            <i class="fab fa-google"></i> Sign in with Google
        </button>

        <div class="switch-mode">
            <span id="switchText">Don't have an account?</span>
            <a id="switchLink">Create one</a>
        </div>
    </div>

    <!-- ============================================
                 LOGIN SCRIPT – FIREBASE AUTH
                 ============================================ -->
    <script>
        (function () {
            'use strict';

            // ---- Suppress the harmless Firebase popup listener error globally ----
            window.addEventListener('unhandledrejection', function (e) {
                const reason = e.reason;
                if (reason && typeof reason === 'object' && reason.message && reason.message.includes('tabs:outgoing.message.ready')) {
                    e.preventDefault();
                    console.warn('Ignored Firebase popup listener error (harmless)');
                } else if (typeof reason === 'string' && reason.includes('tabs:outgoing.message.ready')) {
                    e.preventDefault();
                    console.warn('Ignored Firebase popup listener error (harmless)');
                }
            });

            let isLoginMode = true;

            const emailInput = document.getElementById('email');
            const passwordInput = document.getElementById('password');
            const usernameInput = document.getElementById('username');
            const usernameGroup = document.getElementById('usernameGroup');
            const submitBtn = document.getElementById('submitBtn');
            const switchLink = document.getElementById('switchLink');
            const switchText = document.getElementById('switchText');
            const messageDiv = document.getElementById('messageDiv');
            const modeBadge = document.getElementById('modeBadge');
            const passwordToggle = document.getElementById('passwordToggle');
            const googleBtn = document.getElementById('googleSignInBtn');

            // ---- Password Toggle ----
            passwordToggle.addEventListener('click', () => {
                const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                passwordInput.setAttribute('type', type);
                passwordToggle.innerHTML = type === 'password' ?
                    '<i class="fas fa-eye"></i>' :
                    '<i class="fas fa-eye-slash"></i>';
            });

            // ---- API URL ----
            function getApiUrl() {
                if (typeof window.API_BASE_URL !== 'undefined') return window.API_BASE_URL;
                return window.location.hostname === 'localhost' ?
                    'http://localhost:3000' :
                    'https://anipulse-63jv.onrender.com';
            }

            // ---- Show Message ----
            function showMessage(message, isError = true) {
                const icon = isError ?
                    '<i class="fas fa-exclamation-circle"></i>' :
                    '<i class="fas fa-check-circle"></i>';
                messageDiv.innerHTML = `<div class="${isError ? 'error-msg' : 'success-msg'}">${icon} ${message}</div>`;
                setTimeout(() => { messageDiv.innerHTML = ''; }, 5000);
            }

            // ---- Toggle Mode (Login / Register) ----
            function updateMode() {
                if (isLoginMode) {
                    submitBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Login';
                    switchText.textContent = "Don't have an account?";
                    switchLink.textContent = 'Create one';
                    usernameGroup.style.display = 'none';
                    usernameInput.required = false;
                    modeBadge.textContent = '🔐 Sign In';
                    document.title = 'AniPulse - Login';
                } else {
                    submitBtn.innerHTML = '<i class="fas fa-user-plus"></i> Sign Up';
                    switchText.textContent = 'Already have an account?';
                    switchLink.textContent = 'Login';
                    usernameGroup.style.display = 'block';
                    usernameInput.required = true;
                    modeBadge.textContent = '✨ Sign Up';
                    document.title = 'AniPulse - Sign Up';
                }
            }

            switchLink.addEventListener('click', () => {
                isLoginMode = !isLoginMode;
                updateMode();
                const newUrl = isLoginMode ?
                    window.location.pathname :
                    `${window.location.pathname}?register=true`;
                window.history.pushState({}, '', newUrl);
            });

            // ---- Form Submission (Firebase Auth) ----
            document.getElementById('authForm').addEventListener('submit', async (e) => {
                e.preventDefault();

                const email = emailInput.value.trim();
                const password = passwordInput.value;

                if (!email || !password) {
                    showMessage('Please fill in all fields');
                    return;
                }

                if (!isLoginMode) {
                    const username = usernameInput.value.trim();
                    if (!username || username.length < 3) {
                        showMessage('Username must be at least 3 characters');
                        return;
                    }
                }

                if (password.length < 6) {
                    showMessage('Password must be at least 6 characters');
                    return;
                }

                submitBtn.disabled = true;
                submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Loading...';

                try {
                    const API_URL = getApiUrl();
                    let userCredential;
                    let idToken;

                    if (isLoginMode) {
                        // ---- LOGIN ----
                        userCredential = await firebase.auth().signInWithEmailAndPassword(email, password);
                    } else {
                        // ---- REGISTER ----
                        const username = usernameInput.value.trim();
                        userCredential = await firebase.auth().createUserWithEmailAndPassword(email, password);
                        // Update display name
                        await userCredential.user.updateProfile({ displayName: username });
                    }

                    // Get Firebase ID token
                    idToken = await userCredential.user.getIdToken();

                    // Send token to backend
                    const endpoint = isLoginMode ? '/api/auth/login' : '/api/auth/register';
                    const payload = isLoginMode ?
                        { token: idToken } :
                        { token: idToken, email, username: usernameInput.value.trim() };

                    const response = await fetch(`${API_URL}${endpoint}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    const data = await response.json();
                    if (!response.ok) throw new Error(data.error || 'Authentication failed');

                    // Store token & user data
                    localStorage.setItem('authToken', idToken);
                    localStorage.setItem('user', JSON.stringify(data.user));

                    showMessage(isLoginMode ? 'Login successful! Redirecting...' : 'Registration successful! Redirecting...', false);

                    setTimeout(() => {
                        window.location.href = '/dashboard.html';
                    }, 1000);

                } catch (error) {
                    console.error('Auth error:', error);
                    showMessage(error.message);
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = isLoginMode ?
                        '<i class="fas fa-sign-in-alt"></i> Login' :
                        '<i class="fas fa-user-plus"></i> Sign Up';
                }
            });

            // ---- Google Sign-In (with immediate loading feedback) ----
            googleBtn.addEventListener('click', async () => {
                // 1. Show loading state immediately
                googleBtn.disabled = true;
                googleBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Signing in...';
                showMessage('Opening Google sign-in...', false);

                try {
                    const provider = new firebase.auth.GoogleAuthProvider();
                    const result = await firebase.auth().signInWithPopup(provider);
                    const idToken = await result.user.getIdToken();

                    const API_URL = getApiUrl();
                    const response = await fetch(`${API_URL}/api/auth/google`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ token: idToken })
                    });

                    const data = await response.json();
                    if (!response.ok) throw new Error(data.error || 'Google sign-in failed');

                    localStorage.setItem('authToken', idToken);
                    localStorage.setItem('user', JSON.stringify(data.user));

                    showMessage('Google sign-in successful! Redirecting...', false);
                    setTimeout(() => {
                        window.location.href = '/dashboard.html';
                    }, 1000);

                } catch (error) {
                    // 2. Ignore the harmless Firebase popup listener error
                    if (error.message && error.message.includes('tabs:outgoing.message.ready')) {
                        console.warn('Ignored harmless Firebase popup listener error');
                        // Reset button state
                        googleBtn.disabled = false;
                        googleBtn.innerHTML = '<i class="fab fa-google"></i> Sign in with Google';
                        // Clear the message
                        setTimeout(() => { messageDiv.innerHTML = ''; }, 3000);
                        return;
                    }
                    console.error('Google sign-in error:', error);
                    showMessage(error.message);
                    // Reset button state
                    googleBtn.disabled = false;
                    googleBtn.innerHTML = '<i class="fab fa-google"></i> Sign in with Google';
                }
            });

            // ---- Check URL params for register mode ----
            window.addEventListener('load', () => {
                const urlParams = new URLSearchParams(window.location.search);
                if (urlParams.get('register') === 'true') {
                    isLoginMode = false;
                    updateMode();
                }
                console.log('🔧 Login page loaded. API URL:', getApiUrl());
            });

        })();
    </script>
</body>
</html>
