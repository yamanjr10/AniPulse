<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AniPulse - Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Poppins:wght@700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="Frontend/Css/login.css">
</head>
<body>
    <div class="particles"></div>
    <div class="floating-element"></div>
    <div class="floating-element"></div>
    
    <div class="theme-toggle-container">
        <button class="theme-toggle-btn" id="themeToggle" aria-label="Toggle theme">
            <i class="fas fa-moon"></i>
        </button>
    </div>
    
    <div class="auth-container">
        <div class="auth-header">
            <div class="app-logo">
                <i class="fas fa-heart-pulse"></i>
                <h1>AniPulse</h1>
            </div>
            <h2>Welcome Back!</h2>
            <p>Sign in to continue your anime journey</p>
        </div>
        
        <form class="auth-form" id="loginForm">
            <div class="form-group">
                <label for="email">
                    <i class="fas fa-envelope"></i>
                    Email Address
                </label>
                <div class="input-with-icon">
                    <i class="fas fa-envelope"></i>
                    <input type="email" id="email" placeholder="your.email@example.com" required>
                </div>
            </div>
            
            <div class="form-group">
                <label for="password">
                    <i class="fas fa-lock"></i>
                    Password
                </label>
                <div class="input-with-icon">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="password" placeholder="••••••••" required>
                    <button type="button" class="password-toggle" id="passwordToggle" aria-label="Show password">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
            </div>
            
            <button type="submit" class="submit-btn" id="loginBtn">
                <i class="fas fa-sign-in-alt"></i>
                Sign In
            </button>
            
            <div id="msg"></div>
            
            <div class="auth-footer">
                <p>New to AniPulse? <a href="signup.html"><i class="fas fa-user-plus"></i> Create an account</a></p>
                <p style="margin-top: 0.5rem;">
                    <a href="#" id="forgotPassword"><i class="fas fa-key"></i> Forgot your password?</a>
                </p>
            </div>
        </form>
    </div>

    <script src="Frontend/Js/auth-script.js"></script>
</body>
</html>
