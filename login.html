<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AniPulse - Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #0B1120 0%, #1A1F2E 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .auth-card {
            background: rgba(26, 31, 46, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 32px;
            padding: 48px 40px;
            width: 100%;
            max-width: 460px;
            border: 1px solid rgba(139, 92, 246, 0.3);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .logo {
            text-align: center;
            margin-bottom: 32px;
        }

        .logo i {
            font-size: 48px;
            color: #8B5CF6;
        }

        .logo h1 {
            font-size: 28px;
            margin-top: 12px;
            background: linear-gradient(135deg, #FFFFFF, #A78BFA);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #94A3B8;
            font-size: 14px;
            font-weight: 500;
        }

        .form-group input {
            width: 100%;
            padding: 14px 16px;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(139, 92, 246, 0.3);
            border-radius: 16px;
            color: white;
            font-size: 16px;
        }

        .form-group input:focus {
            outline: none;
            border-color: #8B5CF6;
        }

        .btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #6366F1, #8B5CF6);
            border: none;
            border-radius: 16px;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px -5px rgba(99, 102, 241, 0.4);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .switch-mode {
            text-align: center;
            margin-top: 24px;
            color: #94A3B8;
        }

        .switch-mode a {
            color: #A78BFA;
            cursor: pointer;
            text-decoration: none;
        }

        .error-msg {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 20px;
            color: #F87171;
            font-size: 14px;
            text-align: center;
        }

        .success-msg {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.3);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 20px;
            color: #34D399;
            font-size: 14px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="auth-card">
        <div class="logo">
            <i class="fas fa-heartbeat"></i>
            <h1>AniPulse</h1>
        </div>

        <div id="messageDiv"></div>

        <form id="authForm">
            <div class="form-group" id="usernameGroup" style="display: none;">
                <label>Username</label>
                <input type="text" id="username" placeholder="Choose a username">
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" placeholder="Enter your email" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="Enter password" required>
            </div>
            <button type="submit" class="btn" id="submitBtn">Login</button>
        </form>

        <div class="switch-mode">
            <span id="switchText">Don't have an account?</span>
            <a id="switchLink">Create one</a>
        </div>
    </div>

   <script defer src="/Frontend/Js/config.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
<script>
    let isLoginMode = true;
    
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const usernameInput = document.getElementById('username');
    const usernameGroup = document.getElementById('usernameGroup');
    const submitBtn = document.getElementById('submitBtn');
    const switchLink = document.getElementById('switchLink');
    const switchText = document.getElementById('switchText');
    const messageDiv = document.getElementById('messageDiv');

    // Get API URL from config.js or use default
    const getApiUrl = () => {
        // If config.js loaded, use its API_BASE_URL
        if (typeof window.API_BASE_URL !== 'undefined') {
            return window.API_BASE_URL;
        }
        // Fallback: determine based on environment
        const isProduction = window.location.hostname !== 'localhost' && window.location.hostname !== '127.0.0.1';
        return isProduction ? 'https://anipulse-63jv.onrender.com' : 'http://localhost:3000';
    };

    function showMessage(message, isError = true) {
        messageDiv.innerHTML = `<div class="${isError ? 'error-msg' : 'success-msg'}">${message}</div>`;
        setTimeout(() => {
            messageDiv.innerHTML = '';
        }, 5000);
    }

    function updateMode() {
        if (isLoginMode) {
            submitBtn.textContent = 'Login';
            switchText.textContent = "Don't have an account?";
            switchLink.textContent = 'Create one';
            usernameGroup.style.display = 'none';
            usernameInput.required = false;
            document.title = 'AniPulse - Login';
        } else {
            submitBtn.textContent = 'Sign Up';
            switchText.textContent = 'Already have an account?';
            switchLink.textContent = 'Login';
            usernameGroup.style.display = 'block';
            usernameInput.required = true;
            document.title = 'AniPulse - Sign Up';
        }
    }

    switchLink.onclick = () => {
        isLoginMode = !isLoginMode;
        updateMode();
        const newUrl = isLoginMode ? window.location.pathname : `${window.location.pathname}?register=true`;
        window.history.pushState({}, '', newUrl);
    };

    // Handle form submission
    document.getElementById('authForm').onsubmit = async (e) => {
        e.preventDefault();
        
        const email = emailInput.value.trim();
        const password = passwordInput.value;
        
        if (!email || !password) {
            showMessage('Please fill in all fields');
            return;
        }
        
        if (!isLoginMode) {
            const username = usernameInput.value.trim();
            if (!username || username.length < 3) {
                showMessage('Username must be at least 3 characters');
                return;
            }
        }
        
        if (password.length < 6) {
            showMessage('Password must be at least 6 characters');
            return;
        }
        
        // Show loading state on button
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Loading...';
        
        try {
            const API_URL = getApiUrl();
            const endpoint = isLoginMode ? '/api/auth/login' : '/api/auth/register';
            const fullUrl = `${API_URL}${endpoint}`;
            
            console.log('📡 API Request to:', fullUrl);
            
            let response;
            if (isLoginMode) {
                response = await fetch(fullUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
            } else {
                const username = usernameInput.value.trim();
                response = await fetch(fullUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password, username })
                });
            }
            
            const data = await response.json();
            
            if (!response.ok) {
                throw new Error(data.error || 'Authentication failed');
            }
            
            localStorage.setItem('authToken', data.token);
            localStorage.setItem('user', JSON.stringify(data.user));
            
            showMessage(isLoginMode ? 'Login successful! Redirecting...' : 'Registration successful! Redirecting...', false);
            
            // Redirect to dashboard
            setTimeout(() => {
                window.location.href = '/dashboard.html';
            }, 1000);
            
        } catch (error) {
            console.error('Error:', error);
            showMessage(error.message);
            submitBtn.disabled = false;
            submitBtn.innerHTML = isLoginMode ? 'Login' : 'Sign Up';
        }
    };

    // Check URL for ?register=true to set initial mode
    window.onload = () => {
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('register') === 'true') {
            isLoginMode = false;
            updateMode();
        }
        console.log('🔧 Login page loaded. API URL:', getApiUrl());
    };
</script>
</body>
</html>
