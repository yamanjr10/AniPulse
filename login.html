<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AniPulse - Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800;14..32,900&display=swap" rel="stylesheet">
    <style>
        /* ============================================
           LOGIN PAGE - PREMIUM ANIPULSE DESIGN
           ============================================ */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #0B1120 0%, #1A1F2E 50%, #0B1120 100%);
            background-size: 300% 300%;
            animation: gradientShift 8s ease-in-out infinite;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        @keyframes gradientShift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        /* ===== FLOATING GLOW ORBS ===== */
        .bg-orbs {
            position: fixed;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
            z-index: 0;
        }

        .bg-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.3;
            animation: orbFloat 10s ease-in-out infinite;
        }

        .bg-orb-1 {
            width: 350px;
            height: 350px;
            background: rgba(139, 92, 246, 0.12);
            top: -120px;
            right: -120px;
            animation-delay: 0s;
        }

        .bg-orb-2 {
            width: 280px;
            height: 280px;
            background: rgba(99, 102, 241, 0.08);
            bottom: -100px;
            left: -100px;
            animation-delay: -4s;
        }

        .bg-orb-3 {
            width: 200px;
            height: 200px;
            background: rgba(236, 72, 153, 0.06);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation-delay: -7s;
        }

        @keyframes orbFloat {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(50px, -50px) scale(1.2); }
            66% { transform: translate(-40px, 40px) scale(0.8); }
        }

        /* ============================================
           AUTH CARD
           ============================================ */

        .auth-card {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-radius: 40px;
            padding: 48px 40px;
            width: 100%;
            max-width: 440px;
            border: 1px solid rgba(139, 92, 246, 0.15);
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.4);
            position: relative;
            z-index: 1;
            animation: fadeInUp 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        /* Premium Border Glow */
        .auth-card::before {
            content: '';
            position: absolute;
            inset: -1.5px;
            border-radius: 40px;
            background: linear-gradient(135deg, 
                rgba(139, 92, 246, 0.3) 0%, 
                rgba(99, 102, 241, 0.1) 30%,
                rgba(236, 72, 153, 0.05) 60%,
                rgba(139, 92, 246, 0.2) 100%
            );
            background-size: 300% 300%;
            animation: borderGlow 4s ease-in-out infinite;
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
            z-index: -1;
        }

        @keyframes borderGlow {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(40px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* ============================================
           LOGO
           ============================================ */

        .logo {
            text-align: center;
            margin-bottom: 32px;
        }

        .logo-icon {
            width: 72px;
            height: 72px;
            background: linear-gradient(135deg, #8B5CF6, #6366F1);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
            font-size: 2.2rem;
            color: white;
            box-shadow: 0 8px 30px rgba(139, 92, 246, 0.3);
            animation: iconPulse 3s ease-in-out infinite;
            position: relative;
        }

        .logo-icon::after {
            content: '';
            position: absolute;
            inset: -3px;
            border-radius: 22px;
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.3), transparent);
            animation: iconRing 3s ease-in-out infinite;
            z-index: -1;
        }

        @keyframes iconPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.03); }
        }

        @keyframes iconRing {
            0%, 100% { opacity: 0.4; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.05); }
        }

        .logo h1 {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -0.03em;
            background: linear-gradient(135deg, #FFFFFF 30%, #A78BFA 70%, #6366F1);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .logo .subtitle {
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.3);
            margin-top: 4px;
            font-weight: 400;
        }

        /* ============================================
           MODE BADGE
           ============================================ */

        .mode-badge {
            display: inline-block;
            font-size: 0.7rem;
            font-weight: 700;
            color: #A78BFA;
            background: rgba(139, 92, 246, 0.1);
            padding: 4px 16px;
            border-radius: 20px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            border: 1px solid rgba(139, 92, 246, 0.08);
            margin-bottom: 24px;
        }

        /* ============================================
           FORM
           ============================================ */

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            color: rgba(255, 255, 255, 0.4);
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .form-group input {
            width: 100%;
            padding: 14px 18px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 16px;
            color: white;
            font-size: 1rem;
            font-family: 'Inter', sans-serif;
            transition: all 0.3s ease;
        }

        .form-group input::placeholder {
            color: rgba(255, 255, 255, 0.15);
        }

        .form-group input:focus {
            outline: none;
            border-color: rgba(139, 92, 246, 0.3);
            background: rgba(255, 255, 255, 0.05);
            box-shadow: 0 0 0 4px rgba(139, 92, 246, 0.05);
        }

        .form-group input:focus + label {
            color: #A78BFA;
        }

        /* ===== PASSWORD TOGGLE ===== */
        .password-wrapper {
            position: relative;
        }

        .password-wrapper input {
            padding-right: 50px;
        }

        .password-toggle {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.2);
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .password-toggle:hover {
            color: rgba(255, 255, 255, 0.5);
        }

        /* ============================================
           BUTTON
           ============================================ */

        .btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #6366F1, #8B5CF6);
            border: none;
            border-radius: 16px;
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 20px rgba(99, 102, 241, 0.25);
            position: relative;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            transition: left 0.6s ease;
        }

        .btn:hover::before {
            left: 100%;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 35px -5px rgba(99, 102, 241, 0.5);
        }

        .btn:active {
            transform: translateY(0) scale(0.98);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
        }

        /* ============================================
           SWITCH MODE
           ============================================ */

        .switch-mode {
            text-align: center;
            margin-top: 24px;
            color: rgba(255, 255, 255, 0.3);
            font-size: 0.9rem;
        }

        .switch-mode a {
            color: #A78BFA;
            cursor: pointer;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
            position: relative;
        }

        .switch-mode a::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 0;
            height: 2px;
            background: linear-gradient(90deg, #A78BFA, #6366F1);
            transition: width 0.3s ease;
        }

        .switch-mode a:hover::after {
            width: 100%;
        }

        .switch-mode a:hover {
            color: #C4B5FD;
        }

        /* ============================================
           MESSAGES
           ============================================ */

        .error-msg {
            background: rgba(239, 68, 68, 0.08);
            border: 1px solid rgba(239, 68, 68, 0.15);
            border-radius: 12px;
            padding: 12px 16px;
            margin-bottom: 20px;
            color: #F87171;
            font-size: 0.85rem;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .success-msg {
            background: rgba(16, 185, 129, 0.08);
            border: 1px solid rgba(16, 185, 129, 0.15);
            border-radius: 12px;
            padding: 12px 16px;
            margin-bottom: 20px;
            color: #34D399;
            font-size: 0.85rem;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        /* ============================================
           RESPONSIVE
           ============================================ */

        @media (max-width: 768px) {
            .auth-card {
                padding: 36px 28px;
                border-radius: 32px;
            }

            .logo h1 {
                font-size: 24px;
            }

            .logo-icon {
                width: 60px;
                height: 60px;
                font-size: 1.8rem;
            }
        }

        @media (max-width: 480px) {
            .auth-card {
                padding: 28px 20px;
                border-radius: 24px;
                max-width: 95%;
            }

            .logo h1 {
                font-size: 22px;
            }

            .logo-icon {
                width: 52px;
                height: 52px;
                font-size: 1.5rem;
            }

            .form-group input {
                padding: 12px 16px;
                font-size: 0.9rem;
            }

            .btn {
                padding: 14px;
                font-size: 0.9rem;
            }

            .switch-mode {
                font-size: 0.8rem;
            }

            .bg-orb-1 {
                width: 150px;
                height: 150px;
                top: -50px;
                right: -50px;
            }

            .bg-orb-2 {
                width: 120px;
                height: 120px;
                bottom: -40px;
                left: -40px;
            }

            .bg-orb-3 {
                width: 100px;
                height: 100px;
            }
        }

        /* ============================================
           REDUCED MOTION
           ============================================ */

        @media (prefers-reduced-motion: reduce) {
            body,
            .auth-card,
            .auth-card::before,
            .logo-icon,
            .logo-icon::after,
            .bg-orb {
                animation: none !important;
            }

            .btn {
                transition: none !important;
            }

            .btn::before {
                display: none !important;
            }

            .switch-mode a::after {
                transition: none !important;
            }
        }

        /* ============================================
           DARK MODE (Default)
           ============================================ */

        /* Already using dark theme by default */

        /* ============================================
           LIGHT MODE
           ============================================ */

        @media (prefers-color-scheme: light) {
            body {
                background: linear-gradient(135deg, #F8FAFC 0%, #FFFFFF 50%, #F1F5F9 100%);
            }

            .auth-card {
                background: rgba(255, 255, 255, 0.8);
                backdrop-filter: blur(24px);
                -webkit-backdrop-filter: blur(24px);
                border-color: rgba(139, 92, 246, 0.08);
                box-shadow: 0 40px 80px rgba(0, 0, 0, 0.06);
            }

            .auth-card::before {
                background: linear-gradient(135deg, 
                    rgba(139, 92, 246, 0.15) 0%, 
                    rgba(99, 102, 241, 0.08) 30%,
                    rgba(236, 72, 153, 0.04) 60%,
                    rgba(139, 92, 246, 0.1) 100%
                );
            }

            .logo h1 {
                background: linear-gradient(135deg, #1a1f2e 30%, #7C3AED 70%, #6366F1);
                -webkit-background-clip: text;
                background-clip: text;
            }

            .logo .subtitle {
                color: rgba(0, 0, 0, 0.2);
            }

            .form-group label {
                color: rgba(0, 0, 0, 0.3);
            }

            .form-group input {
                background: rgba(0, 0, 0, 0.02);
                border-color: rgba(0, 0, 0, 0.06);
                color: #0f172a;
            }

            .form-group input::placeholder {
                color: rgba(0, 0, 0, 0.15);
            }

            .form-group input:focus {
                border-color: rgba(139, 92, 246, 0.2);
                background: rgba(0, 0, 0, 0.04);
                box-shadow: 0 0 0 4px rgba(139, 92, 246, 0.04);
            }

            .password-toggle {
                color: rgba(0, 0, 0, 0.15);
            }

            .password-toggle:hover {
                color: rgba(0, 0, 0, 0.3);
            }

            .switch-mode {
                color: rgba(0, 0, 0, 0.2);
            }

            .switch-mode a {
                color: #7C3AED;
            }

            .switch-mode a:hover {
                color: #6D28D9;
            }

            .mode-badge {
                color: #7C3AED;
                background: rgba(124, 58, 237, 0.08);
                border-color: rgba(124, 58, 237, 0.06);
            }

            .bg-orb-1 {
                background: rgba(139, 92, 246, 0.04);
            }

            .bg-orb-2 {
                background: rgba(99, 102, 241, 0.03);
            }

            .bg-orb-3 {
                background: rgba(236, 72, 153, 0.02);
            }

            .error-msg {
                background: rgba(239, 68, 68, 0.04);
                border-color: rgba(239, 68, 68, 0.08);
                color: #DC2626;
            }

            .success-msg {
                background: rgba(16, 185, 129, 0.04);
                border-color: rgba(16, 185, 129, 0.08);
                color: #059669;
            }
        }

        /* ============================================
           CUSTOM SCROLLBAR
           ============================================ */

        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(139, 92, 246, 0.3);
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(139, 92, 246, 0.5);
        }
    </style>
</head>
<body>
    <!-- Floating Glow Orbs -->
    <div class="bg-orbs">
        <div class="bg-orb bg-orb-1"></div>
        <div class="bg-orb bg-orb-2"></div>
        <div class="bg-orb bg-orb-3"></div>
    </div>

    <!-- Auth Card -->
    <div class="auth-card">
        <div class="logo">
            <div class="logo-icon">
                <i class="fas fa-heartbeat"></i>
            </div>
            <h1>AniPulse</h1>
            <p class="subtitle">Track. Analyze. Connect.</p>
        </div>

        <div style="text-align: center;">
            <span class="mode-badge" id="modeBadge">🔐 Sign In</span>
        </div>

        <div id="messageDiv"></div>

        <form id="authForm">
            <div class="form-group" id="usernameGroup" style="display: none;">
                <label>Username</label>
                <input type="text" id="username" placeholder="Choose a username">
            </div>
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="email" placeholder="Enter your email" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <div class="password-wrapper">
                    <input type="password" id="password" placeholder="Enter your password" required>
                    <button type="button" class="password-toggle" id="passwordToggle" aria-label="Toggle password visibility">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
            </div>
            <button type="submit" class="btn" id="submitBtn">
                <i class="fas fa-sign-in-alt"></i> Login
            </button>
        </form>

        <div class="switch-mode">
            <span id="switchText">Don't have an account?</span>
            <a id="switchLink">Create one</a>
        </div>
    </div>

    <script defer src="/Frontend/Js/config.js"></script>
    <script>
        // ============================================
        // LOGIN PAGE LOGIC
        // ============================================

        let isLoginMode = true;
        
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const usernameInput = document.getElementById('username');
        const usernameGroup = document.getElementById('usernameGroup');
        const submitBtn = document.getElementById('submitBtn');
        const switchLink = document.getElementById('switchLink');
        const switchText = document.getElementById('switchText');
        const messageDiv = document.getElementById('messageDiv');
        const modeBadge = document.getElementById('modeBadge');
        const passwordToggle = document.getElementById('passwordToggle');

        // ===== PASSWORD TOGGLE =====
        passwordToggle.addEventListener('click', () => {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            passwordToggle.innerHTML = type === 'password' ? 
                '<i class="fas fa-eye"></i>' : 
                '<i class="fas fa-eye-slash"></i>';
        });

        // ===== API URL =====
        const getApiUrl = () => {
            if (typeof window.API_BASE_URL !== 'undefined') {
                return window.API_BASE_URL;
            }
            const isProduction = window.location.hostname !== 'localhost' && window.location.hostname !== '127.0.0.1';
            return isProduction ? 'https://anipulse-63jv.onrender.com' : 'http://localhost:3000';
        };

        // ===== MESSAGES =====
        function showMessage(message, isError = true) {
            const icon = isError ? 
                '<i class="fas fa-exclamation-circle"></i>' : 
                '<i class="fas fa-check-circle"></i>';
            messageDiv.innerHTML = `<div class="${isError ? 'error-msg' : 'success-msg'}">${icon} ${message}</div>`;
            setTimeout(() => {
                messageDiv.innerHTML = '';
            }, 5000);
        }

        // ===== UPDATE MODE =====
        function updateMode() {
            if (isLoginMode) {
                submitBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Login';
                switchText.textContent = "Don't have an account?";
                switchLink.textContent = 'Create one';
                usernameGroup.style.display = 'none';
                usernameInput.required = false;
                modeBadge.textContent = '🔐 Sign In';
                document.title = 'AniPulse - Login';
            } else {
                submitBtn.innerHTML = '<i class="fas fa-user-plus"></i> Sign Up';
                switchText.textContent = 'Already have an account?';
                switchLink.textContent = 'Login';
                usernameGroup.style.display = 'block';
                usernameInput.required = true;
                modeBadge.textContent = '✨ Sign Up';
                document.title = 'AniPulse - Sign Up';
            }
        }

        // ===== SWITCH MODE =====
        switchLink.onclick = () => {
            isLoginMode = !isLoginMode;
            updateMode();
            const newUrl = isLoginMode ? window.location.pathname : `${window.location.pathname}?register=true`;
            window.history.pushState({}, '', newUrl);
        };

        // ===== FORM SUBMISSION =====
        document.getElementById('authForm').onsubmit = async (e) => {
            e.preventDefault();
            
            const email = emailInput.value.trim();
            const password = passwordInput.value;
            
            if (!email || !password) {
                showMessage('Please fill in all fields');
                return;
            }
            
            if (!isLoginMode) {
                const username = usernameInput.value.trim();
                if (!username || username.length < 3) {
                    showMessage('Username must be at least 3 characters');
                    return;
                }
            }
            
            if (password.length < 6) {
                showMessage('Password must be at least 6 characters');
                return;
            }
            
            // Loading state
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Loading...';
            
            try {
                const API_URL = getApiUrl();
                const endpoint = isLoginMode ? '/api/auth/login' : '/api/auth/register';
                const fullUrl = `${API_URL}${endpoint}`;
                
                console.log('📡 API Request to:', fullUrl);
                
                let response;
                if (isLoginMode) {
                    response = await fetch(fullUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email, password })
                    });
                } else {
                    const username = usernameInput.value.trim();
                    response = await fetch(fullUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email, password, username })
                    });
                }
                
                const data = await response.json();
                
                if (!response.ok) {
                    throw new Error(data.error || 'Authentication failed');
                }
                
                localStorage.setItem('authToken', data.token);
                localStorage.setItem('user', JSON.stringify(data.user));
                
                showMessage(isLoginMode ? 'Login successful! Redirecting...' : 'Registration successful! Redirecting...', false);
                
                setTimeout(() => {
                    window.location.href = '/dashboard.html';
                }, 1000);
                
            } catch (error) {
                console.error('Error:', error);
                showMessage(error.message);
                submitBtn.disabled = false;
                submitBtn.innerHTML = isLoginMode ? 
                    '<i class="fas fa-sign-in-alt"></i> Login' : 
                    '<i class="fas fa-user-plus"></i> Sign Up';
            }
        };

        // ===== CHECK URL PARAMS =====
        window.onload = () => {
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('register') === 'true') {
                isLoginMode = false;
                updateMode();
            }
            console.log('🔧 Login page loaded. API URL:', getApiUrl());
        };

        // ===== ENTER KEY SUPPORT =====
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                const form = document.getElementById('authForm');
                if (form) {
                    form.dispatchEvent(new Event('submit'));
                }
            }
        });
    </script>
</body>
</html>
